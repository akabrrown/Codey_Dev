<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: #f0f4f8; font-family: sans-serif; padding: 40px; display: flex; flex-direction: column; gap: 30px; align-items: center; }
    .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .dark-card { background: #0E2338; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); display: flex; flex-direction: column; align-items: center; gap: 16px; }
    h3 { margin: 0; color: #555; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
    .dark-card h3 { color: #fff; }
  </style>
</head>
<body>
  <div class="card">
    <h3>Original Uploaded File (Raw 311x85 JPG with background lines)</h3>
    <img src="logo codey dev.jpg" style="height: 50px;">
  </div>
  
  <div class="card">
    <h3>Enhanced Quality Master (Clean Transparent PNG 1100x340)</h3>
    <img src="logo_codey_dev_enhanced.png" style="height: 50px;">
  </div>

  <div class="dark-card">
    <h3>On Dark Header / Website Container</h3>
    <div style="background: rgba(255,255,255,0.95); padding: 8px 18px; border-radius: 8px;">
      <img src="logo_codey_dev_enhanced.png" style="height: 36px;">
    </div>
  </div>
</body>
</html>
