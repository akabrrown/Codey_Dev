<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Codey Dev Banner 728x90 White</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
    html, body { width: 728px; height: 90px; overflow: hidden; background: transparent; font-family: 'Inter', sans-serif; }
    .banner {
      width: 728px; height: 90px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; background: #FFFFFF; border: 1px solid #CBD5E1; color: #0A192A; text-decoration: none;
    }
    .banner::before {
      content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 4px;
      background: linear-gradient(180deg, #38D2F0 0%, #0088EA 100%);
    }
    .col-logo { display: flex; flex-direction: column; justify-content: center; gap: 3px; flex-shrink: 0; width: 155px; z-index: 2; }
    .logo-img { height: 34px; width: auto; object-fit: contain; display: block; }
    .logo-tagline { font-size: 8.5px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #0077D7; }
    .divider { width: 1px; height: 60px; flex-shrink: 0; margin: 0 10px; background: #E2E8F0; }
    .col-center { display: flex; flex-direction: column; justify-content: center; flex: 1; gap: 5px; padding-right: 12px; z-index: 2; }
    .headline { font-family: 'Outfit', sans-serif; font-size: 14.5px; font-weight: 800; line-height: 1.2; letter-spacing: -0.01em; white-space: nowrap; color: #0A192A; }
    .headline strong { color: #0077D7; }
    .offer-row { display: flex; align-items: center; gap: 6px; }
    .pill { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 600; padding: 2.5px 7px; border-radius: 4px; white-space: nowrap; line-height: 1.2; background: #F1F5F9; border: 1px solid #E2E8F0; color: #334155; }
    .pill strong { color: #0284C7; font-weight: 800; }
    .trust-line { font-size: 9.5px; display: flex; align-items: center; gap: 10px; color: #64748B; }
    .trust-check { color: #0077D7; font-weight: 800; }
    .col-cta { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 4px; flex-shrink: 0; width: 150px; z-index: 2; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-family: 'Outfit', sans-serif; font-size: 12.5px; font-weight: 800; padding: 7px 14px; border-radius: 6px; letter-spacing: 0.02em; white-space: nowrap; text-decoration: none; background: #0A192A; color: #FFFFFF; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15); }
    .contact-sub { font-size: 9.5px; font-weight: 600; letter-spacing: 0.03em; color: #475569; }
  </style>
</head>
<body>
  <div class="banner">
    <div class="col-logo">
      <img src="logo_codey_dev_enhanced.png" alt="Codey Dev" class="logo-img">
      <span class="logo-tagline">ACCRA, GHANA</span>
    </div>
    <div class="divider"></div>
    <div class="col-center">
      <div class="headline">
        Custom Web Platforms, POS &amp; Mobile Apps <strong>Starting at 1,000 GH₵</strong>
      </div>
      <div class="offer-row">
        <span class="pill">Websites <strong>From 1,000 GH₵</strong></span>
        <span class="pill">POS &amp; Software <strong>From 2,000 GH₵</strong></span>
        <span class="pill">Apps <strong>From 2,500 GH₵</strong></span>
      </div>
      <div class="trust-line">
        <span><span class="trust-check">✓</span> Transparent Fixed Quotes</span>
        <span><span class="trust-check">✓</span> 24h Written Scope Guarantee</span>
      </div>
    </div>
    <div class="col-cta">
      <div class="btn">Get a Quote →</div>
      <div class="contact-sub">💬 WhatsApp: 020 381 3606</div>
    </div>
  </div>
</body>
</html>
